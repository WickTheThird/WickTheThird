<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Filip Bumbu's animated systems lab</title>
  <desc id="description">An isometric software system with an API, message queue, database, and moving data packets.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#06101d"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="48%" r="52%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".16"/>
      <stop offset=".48" stop-color="#7c5cff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2a5274"/>
      <stop offset="1" stop-color="#183754"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#173653"/>
      <stop offset="1" stop-color="#0d2138"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#102c47"/>
      <stop offset="1" stop-color="#091b30"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000814" flood-opacity=".65"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="skewY(-30) scale(1 .5)">
      <path d="M32 0H0V32" fill="none" stroke="#86a9c5" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .label { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .route { fill: none; stroke: #42627d; stroke-width: 2; stroke-dasharray: 4 7; }
    .packet { fill: #71f6ff; filter: url(#softGlow); }
    .float-a { animation: floatA 6s ease-in-out infinite; transform-origin: center; }
    .float-b { animation: floatB 7.4s ease-in-out infinite; transform-origin: center; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
    .blink { animation: blink 1.05s steps(2, end) infinite; }
    .dash { stroke-dasharray: 8 12; animation: dash 3s linear infinite; }
    @keyframes floatA { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
    @keyframes floatB { 0%,100% { transform: translateY(0) } 50% { transform: translateY(7px) } }
    @keyframes pulse { 0%,100% { opacity: .45; transform: scale(.94) } 50% { opacity: 1; transform: scale(1.08) } }
    @keyframes blink { 50% { opacity: 0 } }
    @keyframes dash { to { stroke-dashoffset: -40 } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>

  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="28" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="558" rx="27" fill="none" stroke="#79eefa" stroke-opacity=".16"/>
  <circle cx="1120" cy="72" r="180" fill="#6e56ff" opacity=".035"/>
  <circle cx="1010" cy="480" r="220" fill="#00ddff" opacity=".025"/>

  <g opacity=".7">
    <circle cx="44" cy="40" r="5" fill="#ff6b80"/>
    <circle cx="62" cy="40" r="5" fill="#ffd166"/>
    <circle cx="80" cy="40" r="5" fill="#55e6a5"/>
    <path d="M104 40H264" stroke="#7fa2bc" stroke-opacity=".23" stroke-width="2"/>
    <text x="1090" y="44" class="label" fill="#66f0ff">ONLINE</text>
    <circle cx="1072" cy="40" r="5" fill="#55e6a5" class="pulse"/>
  </g>

  <g transform="translate(70 112)">
    <text class="label" fill="#6beeff">SYSTEMS / REALTIME / TOOLING</text>
    <text y="72" fill="#f4f8ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="760" letter-spacing="-2">FILIP BUMBU</text>
    <text y="114" fill="#9bb2c8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">I build software that stays understandable</text>
    <text y="144" fill="#9bb2c8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">when the traffic stops being polite.</text>

    <g transform="translate(0 198)">
      <rect width="430" height="158" rx="14" fill="#081321" stroke="#6beeff" stroke-opacity=".16"/>
      <rect x="1" y="1" width="428" height="28" rx="13" fill="#10223a"/>
      <circle cx="17" cy="15" r="3" fill="#ff6b80" opacity=".8"/>
      <circle cx="29" cy="15" r="3" fill="#ffd166" opacity=".8"/>
      <circle cx="41" cy="15" r="3" fill="#55e6a5" opacity=".8"/>
      <text x="16" y="58" class="mono" font-size="14" fill="#758da2">$ whoami</text>
      <text x="16" y="84" class="mono" font-size="14" fill="#e3edf7">backend engineer · system builder</text>
      <text x="16" y="111" class="mono" font-size="14" fill="#758da2">$ current --project</text>
      <text x="16" y="137" class="mono" font-size="14" fill="#71f6ff">nogur / remote mac, reimagined</text>
      <rect x="352" y="124" width="8" height="17" rx="1" fill="#71f6ff" class="blink"/>
    </g>
  </g>

  <g transform="translate(590 98)" filter="url(#shadow)">
    <path d="M0 210 260 60l260 150-260 150z" fill="#0c1c2c" stroke="#73dce9" stroke-opacity=".17"/>
    <path d="M0 210 260 60l260 150-260 150z" fill="url(#grid)" opacity=".8"/>
    <path d="M260 360v42L0 252v-42z" fill="#081525"/>
    <path d="M260 360v42l260-150v-42z" fill="#071321"/>
    <path d="M0 252 260 402l260-150" fill="none" stroke="#38566f" stroke-opacity=".35"/>

    <g transform="translate(35 120)">
      <g class="float-a">
      <ellipse cx="88" cy="133" rx="79" ry="23" fill="#00e5ff" opacity=".06"/>
      <path d="M8 54 88 8l80 46-80 47z" fill="url(#cubeTop)" stroke="#75eff8" stroke-opacity=".35"/>
      <path d="M8 54v66l80 46v-65z" fill="url(#cubeLeft)"/>
      <path d="M88 101v65l80-46V54z" fill="url(#cubeRight)"/>
      <text x="88" y="59" text-anchor="middle" class="label" fill="#b9f9ff">API</text>
      <path d="M30 91 67 112M30 104l37 21" stroke="#58dfea" stroke-opacity=".36"/>
        <circle cx="146" cy="94" r="5" fill="#55e6a5" class="pulse"/>
      </g>
    </g>

    <g transform="translate(201 45)">
      <g class="float-b">
      <ellipse cx="88" cy="133" rx="79" ry="23" fill="#7c5cff" opacity=".08"/>
      <path d="M8 54 88 8l80 46-80 47z" fill="#3d396c" stroke="#a58dff" stroke-opacity=".45"/>
      <path d="M8 54v66l80 46v-65z" fill="#28254e"/>
      <path d="M88 101v65l80-46V54z" fill="#1d1c40"/>
      <text x="88" y="59" text-anchor="middle" class="label" fill="#ddd5ff">QUEUE</text>
      <g fill="#a896ff" opacity=".62">
        <rect x="29" y="88" width="42" height="5" rx="2"/>
        <rect x="29" y="101" width="30" height="5" rx="2"/>
        <rect x="29" y="114" width="37" height="5" rx="2"/>
        </g>
      </g>
    </g>

    <g transform="translate(340 184)">
      <g class="float-a" style="animation-delay:-2s">
      <ellipse cx="71" cy="113" rx="67" ry="20" fill="#55e6a5" opacity=".06"/>
      <path d="M8 46 71 10l63 36-63 37z" fill="#275761" stroke="#71f6ff" stroke-opacity=".35"/>
      <path d="M8 46v56l63 36V83z" fill="#173b48"/>
      <path d="M71 83v55l63-36V46z" fill="#102d3b"/>
      <text x="71" y="51" text-anchor="middle" class="label" fill="#c6fff3">DATA</text>
        <path d="M29 79c0 9 37 9 37 0m-37 13c0 9 37 9 37 0m-37 13c0 9 37 9 37 0" fill="none" stroke="#69e5d0" stroke-opacity=".45"/>
      </g>
    </g>

    <path d="M168 190 C212 155 232 153 262 156" class="route dash" stroke="#72ecf6"/>
    <path d="M365 196 C404 214 414 238 410 270" class="route dash" stroke="#8d74ff" style="animation-delay:-1s"/>
    <path d="M364 326 C302 365 219 344 170 284" class="route dash" stroke="#72ecf6" style="animation-delay:-2s"/>

    <circle r="5" class="packet">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M168 190 C212 155 232 153 262 156"/>
    </circle>
    <circle r="5" class="packet">
      <animateMotion dur="3.2s" begin="-.8s" repeatCount="indefinite" path="M365 196 C404 214 414 238 410 270"/>
    </circle>
    <circle r="5" class="packet">
      <animateMotion dur="3.8s" begin="-1.6s" repeatCount="indefinite" path="M364 326 C302 365 219 344 170 284"/>
    </circle>

    <g opacity=".45">
      <path d="M260 60v300M0 210l520 42M0 252l520-42" stroke="#65dbe7" stroke-opacity=".1"/>
      <ellipse cx="260" cy="220" rx="210" ry="112" fill="none" stroke="#74e8f2" stroke-opacity=".12" stroke-dasharray="3 10"/>
    </g>
  </g>

  <g transform="translate(1048 496)">
    <text x="0" y="0" text-anchor="end" class="label" fill="#7992a8">CLICK TO ENTER</text>
    <path d="m12-5h18m-7-7 7 7-7 7" fill="none" stroke="#70f4ff" stroke-width="2"/>
  </g>
</svg>
