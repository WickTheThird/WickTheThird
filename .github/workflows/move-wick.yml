name: Move Wick

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: readme-dungeon
  cancel-in-progress: false

jobs:
  move:
    if: >-
      github.event.issue.title == '[move] up' ||
      github.event.issue.title == '[move] down' ||
      github.event.issue.title == '[move] left' ||
      github.event.issue.title == '[move] right'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the current dungeon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Move Wick
        env:
          MOVE_TITLE: ${{ github.event.issue.title }}
        run: |
          python3 -m unittest discover -s tests
          python3 scripts/game.py move

      - name: Save a valid move
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "wick-dungeon[bot]"
          git config user.email "wick-dungeon[bot]@users.noreply.github.com"
          git add README.md assets/dungeon.svg game/state.json
          git commit -m "Move Wick: ${{ github.event.issue.title }}"
          git push

      - name: Close the move request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --reason completed
